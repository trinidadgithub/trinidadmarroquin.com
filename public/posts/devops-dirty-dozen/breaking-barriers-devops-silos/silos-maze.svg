  <g fill="#2563eb">
    <circle cx="215" cy="190" r="34"/><circle cx="520" cy="190" r="34"/><circle cx="830" cy="485" r="34"/><circle cx="980" cy="190" r="34"/>
  </g>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">
