  <g stroke="#1e293b" stroke-width="24" stroke-linecap="square" fill="none">
    <path d="M130 120h940M130 555h940M130 120v435M1070 120v435"/>
    <path d="M280 120v270M430 285v270M580 120v270M730 285v270M880 120v270"/>
    <path d="M130 255h220M430 255h220M730 255h220M250 420h220M550 420h220M850 420h220"/>
