<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Disconnected teams on separate islands</title>
  <desc id="desc">Three teams stand on separate islands surrounded by rough water, representing organizational silos.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <path d="M0 430c90-35 160 35 250 0s160 35 250 0 160 35 250 0 160 35 250 0 140 20 200 0v245H0Z" fill="#1d4ed8" opacity="0.75"/>
  <path d="M0 500c90-28 160 28 250 0s160 28 250 0 160 28 250 0 160 28 250 0 140 16 200 0v175H0Z" fill="#38bdf8" opacity="0.35"/>
  <g fill="#334155">
    <ellipse cx="250" cy="430" rx="150" ry="48"/>
    <ellipse cx="600" cy="405" rx="150" ry="48"/>
    <ellipse cx="950" cy="430" rx="150" ry="48"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">
    <text x="250" y="350">Dev</text>
    <text x="600" y="325">Ops</text>
    <text x="950" y="350">Security</text>
  </g>
  <g stroke="#f97316" stroke-width="8" stroke-linecap="round" stroke-dasharray="18 22" fill="none">
    <path d="M335 370c70-40 125-48 185-20"/>
    <path d="M680 350c70-18 125-8 185 20"/>
  </g>
  <g fill="#f8fafc">
    <circle cx="230" cy="380" r="20"/><rect x="205" y="405" width="50" height="60" rx="10"/>
    <circle cx="600" cy="355" r="20"/><rect x="575" y="380" width="50" height="60" rx="10"/>
    <circle cx="970" cy="380" r="20"/><rect x="945" y="405" width="50" height="60" rx="10"/>
  </g>
</svg>
