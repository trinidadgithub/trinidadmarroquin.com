<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">The vicious cycle of blame</title>
  <desc id="desc">A circular diagram showing how blame leads to fear, silence, more incidents, and more blame.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <circle cx="600" cy="340" r="220" fill="none" stroke="#334155" stroke-width="24"/>
  <g fill="none" stroke="#f43f5e" stroke-width="16" stroke-linecap="round">
    <path d="M500 140A200 200 0 0 1 740 180" marker-end="url(#red-arrow)"/>
    <path d="M780 480A200 200 0 0 1 460 540" marker-end="url(#red-arrow)"/>
    <path d="M420 180A200 200 0 0 1 500 140" marker-end="url(#red-arrow)"/>
    <path d="M460 540A200 200 0 0 1 420 180" marker-end="url(#red-arrow)"/>
  </g>
  <defs>
    <marker id="red-arrow" markerWidth="16" markerHeight="16" refX="10" refY="5" orient="auto">
      <path d="M0 0 L0 10 L14 5 z" fill="#f43f5e"/>
    </marker>
  </defs>
  <g fill="#f8fafc" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="130" font-size="34" font-weight="700" fill="#fca5a5">Incident Occurs</text>
    <text x="850" y="350" font-size="34" font-weight="700" fill="#fca5a5">Blame Assigned</text>
    <text x="600" y="590" font-size="34" font-weight="700" fill="#fca5a5">Fear & Silence</text>
    <text x="350" y="350" font-size="34" font-weight="700" fill="#fca5a5">Root Cause</text>
    <text x="350" y="388" font-size="34" font-weight="700" fill="#fca5a5">Hidden</text>
  </g>
  <g fill="#94a3b8" font-family="Arial, sans-serif" text-anchor="middle" font-size="22">
    <text x="600" y="460">The cycle repeats until someone</text>
    <text x="600" y="490">chooses to break it with trust.</text>
  </g>
</svg>
