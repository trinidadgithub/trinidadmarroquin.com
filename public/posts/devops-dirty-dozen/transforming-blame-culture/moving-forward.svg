<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Walking away from blame culture</title>
  <desc id="desc">A team walking together away from a dark blame culture toward a bright learning culture.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="0" y="0" width="400" height="675" fill="#1e293b"/>
  <path d="M400 0 L400 675" stroke="#334155" stroke-width="8"/>
  <g fill="#f43f5e" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="200" font-size="32" font-weight="700" fill="#fca5a5">Blame</text>
    <text x="200" y="240" font-size="32" font-weight="700" fill="#fca5a5">Culture</text>
    <text x="200" y="300" font-size="22" fill="#64748b">Fear</text>
    <text x="200" y="330" font-size="22" fill="#64748b">Secrets</text>
    <text x="200" y="360" font-size="22" fill="#64748b">Defensiveness</text>
    <text x="200" y="390" font-size="22" fill="#64748b">Burnout</text>
  </g>
  <g fill="#22c55e" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="800" y="200" font-size="32" font-weight="700">Learning</text>
    <text x="800" y="240" font-size="32" font-weight="700">Culture</text>
    <text x="800" y="300" font-size="22" fill="#94a3b8">Trust</text>
    <text x="800" y="330" font-size="22" fill="#94a3b8">Transparency</text>
    <text x="800" y="360" font-size="22" fill="#94a3b8">Collaboration</text>
    <text x="800" y="390" font-size="22" fill="#94a3b8">Growth</text>
  </g>
  <g fill="#f8fafc">
    <circle cx="480" cy="480" r="18"/>
    <circle cx="540" cy="450" r="18"/>
    <circle cx="590" cy="470" r="18"/>
    <circle cx="650" cy="440" r="18"/>
    <circle cx="710" cy="460" r="18"/>
  </g>
  <g fill="#94a3b8" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="600" y="550">"Homo homini lupus" does not have to be the final word.</text>
    <text x="600" y="580">Teams can choose a different way forward.</text>
  </g>
</svg>
