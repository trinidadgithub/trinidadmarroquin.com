<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Deep roots of blame culture</title>
  <desc id="desc">Dark tree roots spreading through an organization, labeled with fear, defensiveness, scapegoating.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <g fill="#78350f" stroke="#f97316" stroke-width="4">
    <path d="M600 80 L600 280" stroke="#f97316" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M600 160 450 230" stroke="#92400e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M600 160 750 230" stroke="#92400e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M600 220 350 320" stroke="#92400e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M600 220 850 320" stroke="#92400e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M600 280 200 420" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M600 280 1000 420" stroke="#92400e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M450 230 300 280 250 350" stroke="#92400e" stroke-width="4" fill="none"/>
    <path d="M750 230 900 280 950 350" stroke="#92400e" stroke-width="4" fill="none"/>
    <path d="M350 320 250 380 180 480" stroke="#92400e" stroke-width="3" fill="none"/>
    <path d="M850 320 950 380 1020 480" stroke="#92400e" stroke-width="3" fill="none"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="58" font-size="32" font-weight="700">Blame Culture</text>
    <text x="380" y="210" font-size="22" fill="#fca5a5">Fear</text>
    <text x="820" y="210" font-size="22" fill="#fca5a5">Defensiveness</text>
    <text x="280" y="305" font-size="22" fill="#fca5a5">Scapegoating</text>
    <text x="920" y="305" font-size="22" fill="#fca5a5">Mistrust</text>
    <text x="170" y="400" font-size="22" fill="#fca5a5">Silence</text>
    <text x="1030" y="400" font-size="22" fill="#fca5a5">Burnout</text>
  </g>
  <text x="600" y="560" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">Blame culture grows deep. Pulling it out requires digging at the roots.</text>
</svg>
