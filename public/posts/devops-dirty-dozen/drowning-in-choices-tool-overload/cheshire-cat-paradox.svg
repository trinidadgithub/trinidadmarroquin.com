<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Every tool leads somewhere but none all the way</title>
  <desc id="desc">Multiple diverging paths from a single starting point, showing fragmentation.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <circle cx="600" cy="120" r="40" fill="#f97316"/>
  <text x="600" y="130" fill="#0f172a" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Start</text>
  <g stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M600 160 600 240"/>
    <path d="M600 240 300 340"/>
    <path d="M600 240 900 340"/>
    <path d="M600 240 600 360"/>
    <path d="M300 340 180 440"/>
    <path d="M300 340 420 440"/>
    <path d="M900 340 780 440"/>
    <path d="M900 340 1020 440"/>
    <path d="M600 360 480 460"/>
    <path d="M600 360 720 460"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <text x="290" y="320">CI choice</text>
    <text x="910" y="320">CD choice</text>
    <text x="610" y="350">Secrets</text>
    <text x="170" y="420">Jenkins</text>
    <text x="430" y="420">CircleCI</text>
    <text x="770" y="420">ArgoCD</text>
    <text x="1030" y="420">Spinnaker</text>
    <text x="470" y="440">Vault</text>
    <text x="730" y="440">AWS SM</text>
  </g>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="600" y="540">"If you don't know where you are going, any tool will get you there."</text>
    <text x="600" y="575" font-size="16" font-style="italic">— Adapted from Lewis Carroll</text>
  </g>
</svg>
