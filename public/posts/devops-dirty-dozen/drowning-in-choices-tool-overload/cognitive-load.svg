<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cognitive load from tool context switching</title>
  <desc id="desc">A person at a desk surrounded by floating disconnected tool UIs showing mental fragmentation.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="450" y="350" width="300" height="180" rx="16" fill="#e2e8f0"/>
  <rect x="480" y="380" width="240" height="14" rx="4" fill="#94a3b8"/>
  <rect x="480" y="404" width="200" height="8" rx="3" fill="#cbd5e1"/>
  <rect x="480" y="420" width="220" height="8" rx="3" fill="#cbd5e1"/>
  <rect x="480" y="436" width="160" height="8" rx="3" fill="#cbd5e1"/>
  <circle cx="600" cy="340" r="24" fill="#0f172a"/>
  <g stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M200 280 280 230M240 250l100-40"/>
    <path d="M700 200 800 250M960 280 900 230"/>
    <path d="M180 430 240 500M200 480 300 530"/>
    <path d="M1000 480 950 540"/>
  </g>
  <g fill="#1e293b" stroke="#334155" stroke-width="4">
    <rect x="120" y="200" width="140" height="70" rx="10" fill="#f8fafc" opacity="0.9"/>
    <rect x="940" y="200" width="140" height="70" rx="10" fill="#f8fafc" opacity="0.9"/>
    <rect x="100" y="500" width="140" height="70" rx="10" fill="#f8fafc" opacity="0.9"/>
    <rect x="960" y="500" width="140" height="70" rx="10" fill="#f8fafc" opacity="0.9"/>
  </g>
  <g fill="#334155" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <text x="190" y="225">CI pipeline</text><text x="190" y="250">syntax</text>
    <text x="1010" y="225">Helm chart</text><text x="1010" y="250">values</text>
    <text x="170" y="525">Ticket queue</text><text x="170" y="550">status</text>
    <text x="1030" y="525">Dashboard</text><text x="1030" y="550">query</text>
  </g>
  <text x="600" y="625" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">Context switching is not free. Every window is a tax.</text>
</svg>
