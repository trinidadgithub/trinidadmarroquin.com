<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Paved road of platform engineering</title>
  <desc id="desc">A clean straight road leading to production with guardrails, representing a curated toolchain.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <path d="M200 300 1000 300" stroke="#cbd5e1" stroke-width="120" stroke-linecap="round" fill="none"/>
  <path d="M200 300 1000 300" stroke="#334155" stroke-width="8" stroke-dasharray="24 24" fill="none"/>
  <rect x="180" y="225" width="160" height="150" rx="16" fill="#2563eb"/>
  <rect x="510" y="225" width="160" height="150" rx="16" fill="#2563eb"/>
  <rect x="840" y="225" width="160" height="150" rx="16" fill="#2563eb"/>
  <g fill="#f8fafc" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="260" y="285" font-size="22" font-weight="700">Code</text>
    <text x="260" y="315" font-size="18">Push → branch</text>
    <text x="260" y="340" font-size="18">Auto-test</text>
    <text x="590" y="285" font-size="22" font-weight="700">Pipeline</text>
    <text x="590" y="315" font-size="18">Plan → Apply</text>
    <text x="590" y="340" font-size="18">Approve gate</text>
    <text x="920" y="285" font-size="22" font-weight="700">Production</text>
    <text x="920" y="315" font-size="18">Health checks</text>
    <text x="920" y="340" font-size="18">Rollback ready</text>
  </g>
  <g stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M340 300 510 300"/>
    <path d="M670 300 840 300"/>
  </g>
  <text x="600" y="520" fill="#0f172a" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">A platform is not a restriction. It is a decision already made.</text>
</svg>
