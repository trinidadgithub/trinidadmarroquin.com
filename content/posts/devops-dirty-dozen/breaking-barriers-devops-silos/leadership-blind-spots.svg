<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Leadership blind spots</title>
  <desc id="desc">A leader stands above disconnected team columns while a blind spot hides the gaps between them.</desc>
  <rect width="1200" height="675" fill="#111827"/>
  <circle cx="605" cy="280" r="210" fill="#f8fafc" opacity="0.09"/>
  <g fill="#334155">
    <rect x="170" y="300" width="180" height="260" rx="18"/>
    <rect x="410" y="260" width="180" height="300" rx="18"/>
    <rect x="650" y="330" width="180" height="230" rx="18"/>
    <rect x="890" y="280" width="180" height="280" rx="18"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" text-anchor="middle">
    <text x="260" y="365">Team A</text><text x="500" y="325">Team B</text><text x="740" y="395">Team C</text><text x="980" y="345">Team D</text>
  </g>
  <g fill="#f97316">
    <circle cx="600" cy="135" r="42"/>
    <rect x="550" y="190" width="100" height="150" rx="20"/>
  </g>
  <path d="M515 150c55 38 115 38 170 0" stroke="#111827" stroke-width="18" stroke-linecap="round"/>
  <path d="M240 230h720" stroke="#38bdf8" stroke-width="10" stroke-dasharray="28 20" opacity="0.75"/>
  <text x="600" y="625" fill="#f8fafc" font-family="Arial, sans-serif" font-size="38" text-anchor="middle">Local metrics can hide system-level friction.</text>
</svg>
