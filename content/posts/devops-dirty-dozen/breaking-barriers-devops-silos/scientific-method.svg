<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Scientific method loop</title>
  <desc id="desc">A circular flow from question to hypothesis to test to learn.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <circle cx="600" cy="335" r="205" fill="none" stroke="#334155" stroke-width="28"/>
  <path d="M745 185c75 50 115 130 110 225" stroke="#38bdf8" stroke-width="18" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M455 485c-75-50-115-130-110-225" stroke="#38bdf8" stroke-width="18" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#38bdf8"/></marker></defs>
  <g fill="#f8fafc" font-family="Arial, sans-serif" text-anchor="middle">
    <g font-size="32" font-weight="700">
      <text x="600" y="135">Ask</text><text x="875" y="350">Test</text><text x="600" y="585">Learn</text><text x="325" y="350">Hypothesize</text>
    </g>
    <text x="600" y="330" font-size="44" font-weight="700">Measure change</text>
    <text x="600" y="380" font-size="30">then adapt the system</text>
  </g>
</svg>
