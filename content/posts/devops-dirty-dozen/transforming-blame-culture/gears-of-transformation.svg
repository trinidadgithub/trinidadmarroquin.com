<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Gears of transformation</title>
  <desc id="desc">Interlocking gears turning blame culture into learning culture.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <circle cx="400" cy="340" r="130" fill="none" stroke="#cbd5e1" stroke-width="8"/>
  <circle cx="400" cy="340" r="100" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <circle cx="400" cy="340" r="70" fill="none" stroke="#64748b" stroke-width="4"/>
  <circle cx="400" cy="340" r="30" fill="#f43f5e"/>
  <circle cx="750" cy="340" r="130" fill="none" stroke="#cbd5e1" stroke-width="8"/>
  <circle cx="750" cy="340" r="100" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <circle cx="750" cy="340" r="70" fill="none" stroke="#64748b" stroke-width="4"/>
  <circle cx="750" cy="340" r="30" fill="#22c55e"/>
  <g stroke="#334155" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="400" y1="210" x2="400" y2="260"/>
    <line x1="400" y1="420" x2="400" y2="470"/>
    <line x1="270" y1="340" x2="320" y2="340"/>
    <line x1="480" y1="340" x2="530" y2="340"/>
    <line x1="750" y1="210" x2="750" y2="260"/>
    <line x1="750" y1="420" x2="750" y2="470"/>
    <line x1="620" y1="340" x2="670" y2="340"/>
    <line x1="830" y1="340" x2="880" y2="340"/>
  </g>
  <g fill="#0f172a" font-family="Arial, sans-serif" text-anchor="middle" font-size="32" font-weight="700">
    <text x="400" y="310">Blame</text>
    <text x="400" y="350">Culture</text>
    <text x="750" y="310">Learning</text>
    <text x="750" y="350">Culture</text>
  </g>
  <text x="575" y="350" fill="#64748b" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" transform="rotate(15 575 350)">→</text>
  <text x="600" y="580" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Transformation is not a policy change. It is a gear shift in how the team thinks.</text>
</svg>
