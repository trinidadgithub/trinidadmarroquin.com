<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cost of blame culture</title>
  <desc id="desc">Four collapsing pillars representing innovation, collaboration, incident resolution, and morale.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="4">
    <rect x="120" y="180" width="200" height="300" rx="8"/>
    <rect x="370" y="180" width="200" height="300" rx="8"/>
    <rect x="620" y="180" width="200" height="300" rx="8"/>
    <rect x="870" y="180" width="200" height="300" rx="8"/>
  </g>
  <g fill="#1e293b" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="220" font-size="24" font-weight="700">Innovation</text>
    <text x="470" y="220" font-size="24" font-weight="700">Collaboration</text>
    <text x="720" y="220" font-size="24" font-weight="700">Incident</text>
    <text x="720" y="248" font-size="24" font-weight="700">Resolution</text>
    <text x="970" y="220" font-size="24" font-weight="700">Morale</text>
  </g>
  <g fill="#f43f5e" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="220" y="320" font-size="20">✗ No experiments</text>
    <text x="220" y="350" font-size="20">✗ Risk aversion</text>
    <text x="470" y="320" font-size="20">✗ Finger-pointing</text>
    <text x="470" y="350" font-size="20">✗ Guarded teams</text>
    <text x="720" y="320" font-size="20">✗ Scapegoat hunt</text>
    <text x="720" y="350" font-size="20">✗ Slow recovery</text>
    <text x="970" y="320" font-size="20">✗ Burnout</text>
    <text x="970" y="350" font-size="20">✗ Disengagement</text>
  </g>
  <g stroke="#f43f5e" stroke-width="8" fill="none" stroke-linecap="round">
    <line x1="220" y1="420" x2="140" y2="480"/>
    <line x1="220" y1="420" x2="300" y2="480"/>
    <line x1="470" y1="420" x2="390" y2="480"/>
    <line x1="470" y1="420" x2="550" y2="480"/>
    <line x1="720" y1="420" x2="640" y2="480"/>
    <line x1="720" y1="420" x2="800" y2="480"/>
    <line x1="970" y1="420" x2="890" y2="480"/>
    <line x1="970" y1="420" x2="1050" y2="480"/>
  </g>
  <text x="600" y="580" fill="#0f172a" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Blame is not a productivity tool. It is a productivity killer.</text>
</svg>
