<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DevOps tool sprawl as a tangled jungle</title>
  <desc id="desc">A dense web of connected tools and overlapping lines showing integration complexity.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <g stroke="#334155" stroke-width="6" fill="none">
    <path d="M150 200 350 120 500 220 600 300 750 180"/>
    <path d="M350 120 500 400 750 180 950 250 1050 320"/>
    <path d="M150 200 350 420 500 400 600 500 1050 320"/>
    <path d="M500 220 600 500 950 250 800 450"/>
  </g>
  <g fill="#f97316" stroke="#f97316" stroke-width="4">
    <rect x="100" y="170" width="90" height="50" rx="8" fill="#1e293b" stroke="#f97316"/>
    <rect x="300" y="80" width="90" height="50" rx="8" fill="#1e293b" stroke="#38bdf8"/>
    <rect x="460" y="175" width="90" height="50" rx="8" fill="#1e293b" stroke="#22c55e"/>
    <rect x="550" y="270" width="90" height="50" rx="8" fill="#1e293b" stroke="#a855f7"/>
    <rect x="700" y="145" width="90" height="50" rx="8" fill="#1e293b" stroke="#eab308"/>
    <rect x="475" y="365" width="90" height="50" rx="8" fill="#1e293b" stroke="#ec4899"/>
    <rect x="900" y="225" width="90" height="50" rx="8" fill="#1e293b" stroke="#14b8a6"/>
    <rect x="1000" y="300" width="90" height="50" rx="8" fill="#1e293b" stroke="#f97316"/>
    <rect x="560" y="470" width="90" height="50" rx="8" fill="#1e293b" stroke="#f43f5e"/>
    <rect x="760" y="425" width="90" height="50" rx="8" fill="#1e293b" stroke="#facc15"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="145" y="200">Jenkins</text>
    <text x="345" y="110">Terraform</text>
    <text x="505" y="205">Grafana</text>
    <text x="595" y="300">Vault</text>
    <text x="745" y="175">Prometheus</text>
    <text x="520" y="395">Docker</text>
    <text x="945" y="255">K8s</text>
    <text x="1045" y="330">Ansible</text>
    <text x="605" y="500">Helm</text>
    <text x="805" y="455">ArgoCD</text>
  </g>
  <text x="600" y="610" fill="#94a3b8" font-family="Arial, sans-serif" font-size="32" text-anchor="middle">Each tool made sense at the time.</text>
</svg>
