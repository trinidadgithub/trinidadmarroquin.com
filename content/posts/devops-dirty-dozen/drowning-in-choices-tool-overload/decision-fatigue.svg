<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Decision fatigue from tool choice</title>
  <desc id="desc">A branching road with many forks representing endless tool evaluation decisions.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <path d="M600 40v100" stroke="#f97316" stroke-width="12" stroke-linecap="round" fill="none"/>
  <g stroke="#334155" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M600 140 300 220"/>
    <path d="M600 140 900 220"/>
    <path d="M300 220 150 320"/>
    <path d="M300 220 450 320"/>
    <path d="M900 220 750 320"/>
    <path d="M900 220 1050 320"/>
    <path d="M150 320 80 420"/>
    <path d="M150 320 250 420"/>
    <path d="M450 320 350 420"/>
    <path d="M450 320 550 420"/>
    <path d="M750 320 650 420"/>
    <path d="M750 320 850 420"/>
    <path d="M1050 320 1120 420"/>
    <path d="M1050 320 980 420"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
    <text x="600" y="100" font-weight="700">Pick a CI tool</text>
    <text x="290" y="200">Jenkins</text>
    <text x="910" y="200">GitHub Actions</text>
    <text x="140" y="300">CircleCI</text>
    <text x="460" y="300">GitLab CI</text>
    <text x="740" y="300">Bamboo</text>
    <text x="1060" y="300">Argo Workflows</text>
  </g>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="140" y="400">10 plugins</text>
    <text x="250" y="400">20 plugins</text>
    <text x="450" y="400">15 integrations</text>
    <text x="550" y="400">8 secrets engines</text>
    <text x="750" y="400">12 agents</text>
    <text x="850" y="400">30 steps</text>
    <text x="1050" y="400">50 YAML lines</text>
    <text x="1120" y="400">Custom executor</text>
  </g>
  <text x="600" y="520" fill="#f97316" font-family="Arial, sans-serif" font-size="36" font-weight="700" text-anchor="middle">Analysis paralysis is not laziness.</text>
  <text x="600" y="570" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">It is the system asking for a decision nobody made.</text>
</svg>
