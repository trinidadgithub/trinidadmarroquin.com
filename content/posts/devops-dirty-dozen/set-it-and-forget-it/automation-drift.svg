<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Automation drift</title>
  <desc id="desc">An automation conveyor belt slowly drifting away from the system it is supposed to manage.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="160" y="250" width="420" height="90" rx="16" fill="#1e293b" stroke="#f97316" stroke-width="5"/>
  <text x="370" y="305" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="700">Automation</text>
  <rect x="720" y="180" width="300" height="220" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-width="5"/>
  <text x="870" y="300" fill="#f8fafc" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="700">System</text>
  <path d="M580 295 C650 285 680 235 720 230" stroke="#f43f5e" stroke-width="8" fill="none" stroke-dasharray="14 10"/>
  <path d="M580 320 C670 350 690 400 740 430" stroke="#475569" stroke-width="6" fill="none"/>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">Automation stays correct by being maintained.</text>
</svg>
