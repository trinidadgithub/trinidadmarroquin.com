<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Verify loop</title>
  <desc id="desc">A loop showing configure, operate, verify, update, and repeat.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <circle cx="600" cy="320" r="210" fill="none" stroke="#f97316" stroke-width="6"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="22" font-weight="700">
    <rect x="500" y="95" width="200" height="55" rx="8" fill="#0f172a" opacity="0.85"/>
    <text x="600" y="130" fill="#3b82f6">Configure</text>
    <rect x="790" y="290" width="150" height="55" rx="8" fill="#0f172a" opacity="0.85"/>
    <text x="865" y="325" fill="#f97316">Operate</text>
    <rect x="515" y="500" width="170" height="55" rx="8" fill="#0f172a" opacity="0.85"/>
    <text x="600" y="535" fill="#22c55e">Verify</text>
    <rect x="260" y="290" width="150" height="55" rx="8" fill="#0f172a" opacity="0.85"/>
    <text x="335" y="325" fill="#a855f7">Update</text>
  </g>
  <g fill="none" stroke="#f97316" stroke-width="4">
    <path d="M700 125 Q840 165 850 280"/>
    <path d="M850 355 Q820 470 700 510"/>
    <path d="M500 525 Q370 480 350 355"/>
    <path d="M340 280 Q365 160 500 125"/>
  </g>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">The loop is not complete until the system is verified again.</text>
</svg>
