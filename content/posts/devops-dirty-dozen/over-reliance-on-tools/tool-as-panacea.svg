<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tool as panacea</title>
  <desc id="desc">A single wrench trying to fix three disconnected gears labeled culture, process, and tools.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <g fill="none" stroke-width="6">
    <circle cx="300" cy="300" r="110" stroke="#f43f5e"/>
    <circle cx="600" cy="460" r="110" stroke="#f97316"/>
    <circle cx="900" cy="300" r="110" stroke="#a855f7"/>
  </g>
  <g stroke="#f97316" stroke-width="12" stroke-linecap="round" fill="none">
    <rect x="575" y="80" width="16" height="80" rx="6" fill="#f97316"/>
    <rect x="609" y="80" width="16" height="80" rx="6" fill="#f97316"/>
  </g>
  <g fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round">
    <line x1="583" y1="160" x2="350" y2="240"/>
    <line x1="617" y1="160" x2="600" y2="360"/>
    <line x1="600" y1="175" x2="830" y2="250"/>
  </g>
  <rect x="545" y="155" width="110" height="60" rx="8" fill="#0f172a" opacity="0.8"/>
  <text x="600" y="192" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" font-weight="700">Wrench</text>
  <g fill="#f8fafc" font-family="Arial, sans-serif" text-anchor="middle" font-size="24" font-weight="700">
    <text x="300" y="310">Culture</text>
    <text x="600" y="470">Process</text>
    <text x="900" y="310">Tools</text>
  </g>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">A tool cannot fix what only people and process can.</text>
</svg>
