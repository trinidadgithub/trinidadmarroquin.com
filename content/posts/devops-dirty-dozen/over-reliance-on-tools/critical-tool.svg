<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Critical tool inspection</title>
  <desc id="desc">A magnifying glass inspecting a toolbox with a skeptical eye.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <circle cx="600" cy="300" r="160" fill="none" stroke="#f97316" stroke-width="8"/>
  <circle cx="600" cy="300" r="145" fill="none" stroke="#f97316" stroke-width="3" opacity="0.5"/>
  <g stroke="#f97316" stroke-width="12" stroke-linecap="round" fill="none">
    <line x1="720" y1="420" x2="780" y2="480"/>
  </g>
  <g>
    <rect x="520" y="240" width="40" height="80" rx="6" fill="#92400e" stroke="#f97316" stroke-width="3"/>
    <rect x="570" y="260" width="40" height="60" rx="6" fill="#92400e" stroke="#f97316" stroke-width="3"/>
    <rect x="620" y="250" width="40" height="70" rx="6" fill="#92400e" stroke="#f97316" stroke-width="3"/>
  </g>
  <circle cx="680" cy="220" r="50" fill="#1e293b" stroke="#f8fafc" stroke-width="6"/>
  <circle cx="680" cy="220" r="40" fill="#0f172a" stroke="#f8fafc" stroke-width="3"/>
  <line x1="710" y1="250" x2="730" y2="270" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>
  <text x="600" y="380" fill="#fca5a5" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">?</text>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">The best tool decision is the one you can articulate without buzzwords.</text>
</svg>
