<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">False summit</title>
  <desc id="desc">A team reaching a summit only to see a larger mountain labeled 'culture' ahead.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <path d="M100 580 L350 320 L500 420 L700 220 L850 340 L1100 580Z" fill="#1e293b" stroke="#f97316" stroke-width="4"/>
  <path d="M500 580 L750 180 L1050 580Z" fill="#0f172a" stroke="#a855f7" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="650" y="130" width="100" height="36" rx="8" fill="#0f172a" opacity="0.7"/>
  <text x="700" y="155" fill="#a855f7" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-weight="700">Culture</text>
  <circle cx="380" cy="365" r="10" fill="#f97316"/>
  <circle cx="360" cy="385" r="10" fill="#f97316"/>
  <circle cx="400" cy="385" r="10" fill="#f97316"/>
  <circle cx="380" cy="400" r="10" fill="#f97316"/>
  <rect x="330" y="325" width="100" height="26" rx="6" fill="#0f172a" opacity="0.7"/>
  <text x="380" y="343" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">Team</text>
  <text x="380" y="440" fill="#fca5a5" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">"We made it!"</text>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">Tools can make you feel like you have arrived. Culture is the next climb.</text>
</svg>
