<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tools are not enough</title>
  <desc id="desc">A toolbox on a pedestal with a faded team and broken processes in the background.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <g opacity="0.2">
    <rect x="80" y="120" width="320" height="240" rx="12" fill="#334155"/>
    <path d="M140 210 L200 210 L200 280 L140 280Z" fill="#475569"/>
    <circle cx="320" cy="180" r="30" fill="#475569"/>
    <circle cx="360" cy="240" r="30" fill="#475569"/>
    <path d="M130 340 L300 340" stroke="#f43f5e" stroke-width="4" stroke-dasharray="8 8"/>
  </g>
  <rect x="350" y="250" width="500" height="300" rx="20" fill="#92400e" stroke="#f97316" stroke-width="8"/>
  <rect x="350" y="250" width="500" height="70" rx="20" fill="#78350f"/>
  <text x="600" y="295" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-weight="700">Toolbox</text>
  <g fill="#f97316" stroke="#f97316" stroke-width="3" stroke-linecap="round">
    <rect x="420" y="360" width="40" height="120" rx="6"/>
    <rect x="530" y="330" width="40" height="150" rx="6"/>
    <rect x="650" y="340" width="40" height="140" rx="6"/>
    <rect x="750" y="360" width="40" height="120" rx="6"/>
  </g>
  <rect x="260" y="200" width="680" height="20" rx="10" fill="#78350f"/>
  <rect x="240" y="195" width="30" height="30" rx="8" fill="#78350f"/>
  <rect x="930" y="195" width="30" height="30" rx="8" fill="#78350f"/>
  <g opacity="0.15">
    <rect x="850" y="120" width="280" height="200" rx="12" fill="#334155"/>
    <circle cx="990" cy="180" r="25" fill="#475569"/>
    <path d="M860 290 L1080 290" stroke="#f43f5e" stroke-width="4" stroke-dasharray="8 8"/>
  </g>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">Tools amplify culture. They do not create it.</text>
</svg>
