<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Goodhart's Law</title>
  <desc id="desc">A metric target bending behavior away from the actual outcome.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <line x1="180" y1="500" x2="1020" y2="500" stroke="#475569" stroke-width="5"/>
  <line x1="180" y1="500" x2="180" y2="130" stroke="#475569" stroke-width="5"/>
  <path d="M220 450 C390 360 520 300 650 220" stroke="#22c55e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M650 220 C700 300 780 380 960 445" stroke="#f43f5e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="650" cy="220" r="18" fill="#f97316"/>
  <text x="650" y="195" fill="#f97316" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="700">Target</text>
  <text x="360" y="300" fill="#22c55e" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">Outcome</text>
  <text x="830" y="345" fill="#f43f5e" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">Gaming</text>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">When the measure becomes the target, behavior bends around the number.</text>
</svg>
