<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Outcome compass</title>
  <desc id="desc">A compass pointing from activity toward outcomes.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <circle cx="600" cy="310" r="190" fill="#1e293b" stroke="#f97316" stroke-width="6"/>
  <circle cx="600" cy="310" r="20" fill="#f97316"/>
  <path d="M600 310 L725 190" stroke="#22c55e" stroke-width="12" stroke-linecap="round"/>
  <polygon points="745,170 720,205 705,185" fill="#22c55e"/>
  <path d="M600 310 L500 405" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
  <text x="755" y="165" fill="#22c55e" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-weight="700">Outcomes</text>
  <text x="455" y="430" fill="#94a3b8" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">Activity</text>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">The question is not whether the team is busy. Is the system improving?</text>
</svg>
