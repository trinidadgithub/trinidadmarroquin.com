<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Distorted signal</title>
  <desc id="desc">A clean signal entering a metric machine and coming out warped.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <path d="M120 320 C220 260 320 380 420 320" stroke="#22c55e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <rect x="470" y="210" width="260" height="220" rx="18" fill="#1e293b" stroke="#f97316" stroke-width="6"/>
  <text x="600" y="310" fill="#f8fafc" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-weight="700">Metric</text>
  <text x="600" y="345" fill="#94a3b8" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Machine</text>
  <path d="M780 320 C830 230 880 430 930 310 C980 190 1030 470 1080 320" stroke="#f43f5e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="265" y="250" fill="#22c55e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Signal</text>
  <text x="950" y="245" fill="#f43f5e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">Distortion</text>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">Bad metrics do not just report distortion. They create it.</text>
</svg>
