<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Scientific method applied to automation</title>
  <desc id="desc">A circular flow from ask to gather data to hypothesize to test to iterate.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <circle cx="600" cy="340" r="200" fill="none" stroke="#cbd5e1" stroke-width="24"/>
  <g fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round">
    <path d="M530 160A190 190 0 0 1 740 230" marker-end="url(#blue-arrow)"/>
    <path d="M755 480A190 190 0 0 1 460 520" marker-end="url(#blue-arrow)"/>
    <path d="M445 230A190 190 0 0 1 530 160" marker-end="url(#blue-arrow)"/>
    <path d="M460 520A190 190 0 0 1 445 230" marker-end="url(#blue-arrow)"/>
  </g>
  <defs>
    <marker id="blue-arrow" markerWidth="14" markerHeight="14" refX="8" refY="4" orient="auto">
      <path d="M0 0 L0 8 L12 4 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g fill="#0f172a" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="155" font-size="30" font-weight="700">Ask</text>
    <text x="770" y="350" font-size="30" font-weight="700">Test</text>
    <text x="600" y="560" font-size="30" font-weight="700">Iterate</text>
    <text x="430" y="350" font-size="30" font-weight="700">Gather</text>
    <text x="600" y="340" font-size="28" font-weight="700">What problem</text>
    <text x="600" y="375" font-size="28" font-weight="700">are we solving?</text>
  </g>
</svg>
