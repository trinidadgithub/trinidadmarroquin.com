<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Automation cascade failure</title>
  <desc id="desc">A domino-like cascade showing how one automated failure propagates through the system.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <g fill="#1e293b" stroke="#334155" stroke-width="4">
    <rect x="150" y="200" width="120" height="80" rx="10"/>
    <rect x="320" y="200" width="120" height="80" rx="10"/>
    <rect x="490" y="200" width="120" height="80" rx="10"/>
    <rect x="660" y="200" width="120" height="80" rx="10"/>
    <rect x="830" y="200" width="120" height="80" rx="10"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">
    <text x="210" y="240">Deploy</text>
    <text x="380" y="240">Config</text>
    <text x="550" y="240">Monitor</text>
    <text x="720" y="240" font-size="18">Alerting</text>
    <text x="890" y="240" font-size="18">Rollback</text>
  </g>
  <g stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="270" y1="240" x2="320" y2="240"/>
    <line x1="440" y1="240" x2="490" y2="240"/>
    <line x1="610" y1="240" x2="660" y2="240"/>
    <line x1="780" y1="240" x2="830" y2="240"/>
  </g>
  <g transform="rotate(-12 490 240)">
    <rect x="490" y="198" width="120" height="84" rx="10" fill="none" stroke="#f43f5e" stroke-width="6"/>
  </g>
  <g transform="rotate(-24 660 240)">
    <rect x="660" y="196" width="120" height="88" rx="10" fill="none" stroke="#f43f5e" stroke-width="6"/>
  </g>
  <g transform="rotate(-36 830 240)">
    <rect x="830" y="194" width="120" height="92" rx="10" fill="none" stroke="#f43f5e" stroke-width="6"/>
  </g>
  <g fill="#f43f5e" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">
    <text x="550" y="340">✗ Config template breaks</text>
    <text x="550" y="375">✗ Monitoring misses bad deploy</text>
    <text x="550" y="410">✗ Alerting fires on wrong metric</text>
    <text x="550" y="445">✗ Rollback script has bug too</text>
  </g>
  <text x="600" y="530" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle">Speed is not the goal. Correctness at speed is.</text>
</svg>
