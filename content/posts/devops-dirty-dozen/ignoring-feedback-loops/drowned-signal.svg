<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Drowned signal</title>
  <desc id="desc">A lone red alert line buried in a sea of gray noise lines on a chart.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <g fill="none" stroke-width="3" opacity="0.25">
    <polyline points="100,500 200,480 300,510 400,490 500,520 600,500 700,480 800,510 900,490 1000,520 1100,500" stroke="#475569"/>
    <polyline points="100,480 200,510 300,490 400,520 500,500 600,480 700,510 800,490 900,520 1000,500 1100,480" stroke="#475569"/>
    <polyline points="100,520 200,490 300,480 400,510 500,490 600,520 700,500 800,480 900,510 1000,490 1100,520" stroke="#475569"/>
    <polyline points="100,490 200,520 300,500 400,480 500,510 600,490 700,520 800,500 900,480 1000,510 1100,490" stroke="#475569"/>
    <polyline points="100,510 200,500 300,520 400,500 500,480 600,510 700,490 800,520 900,500 1000,480 1100,510" stroke="#475569"/>
    <polyline points="100,470 200,490 300,510 400,470 500,490 600,510 700,470 800,490 900,510 1000,470 1100,490" stroke="#475569"/>
  </g>
  <g fill="none" stroke-width="5">
    <polyline points="100,380 200,370 300,340 400,310 500,280 600,240 700,190 800,130 810,120" stroke="#f43f5e"/>
  </g>
  <circle cx="810" cy="120" r="8" fill="#f43f5e"/>
  <text x="810" y="105" fill="#f43f5e" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="700">Signal</text>
  <text x="600" y="600" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">The signal is usually there. The hard part is choosing to act.</text>
</svg>
