<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Do not look away</title>
  <desc id="desc">A person turning their head away from a blinking red dashboard light.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <circle cx="850" cy="250" r="60" fill="#1e293b" stroke="#f43f5e" stroke-width="6"/>
  <circle cx="850" cy="250" r="45" fill="#f43f5e" opacity="0.3"/>
  <circle cx="850" cy="250" r="30" fill="#f43f5e" opacity="0.2"/>
  <text x="850" y="258" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">!</text>
  <rect x="800" y="320" width="100" height="8" rx="4" fill="#475569"/>
  <rect x="800" y="338" width="120" height="8" rx="4" fill="#475569"/>
  <rect x="800" y="356" width="80" height="8" rx="4" fill="#475569"/>
  <g>
    <circle cx="340" cy="300" r="40" fill="#1e293b" stroke="#f8fafc" stroke-width="3"/>
    <circle cx="320" cy="290" r="6" fill="#f8fafc"/>
    <circle cx="360" cy="290" r="6" fill="#f8fafc"/>
    <circle cx="340" cy="310" r="4" fill="#f8fafc"/>
    <path d="M350 355 Q360 390 380 420 L420 460" stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M370 370 Q390 380 420 380" stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M300 355 Q290 390 270 420 L240 460" stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M380 280 Q600 260 790 250" stroke="#f8fafc" stroke-width="3" fill="none" stroke-dasharray="8 8" opacity="0.3"/>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">Looking away does not make the signal stop. It just delays the response.</text>
</svg>
