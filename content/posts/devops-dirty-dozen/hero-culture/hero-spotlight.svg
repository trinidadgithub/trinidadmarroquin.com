<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Hero spotlight</title>
  <desc id="desc">One engineer standing under a bright spotlight while a tired team fades into the background.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <path d="M520 80 L680 80 L820 560 L380 560Z" fill="#f97316" opacity="0.14"/>
  <circle cx="600" cy="285" r="42" fill="#f8fafc"/>
  <path d="M600 330 L600 455" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
  <path d="M600 370 L520 420" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <path d="M600 370 L680 420" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <path d="M600 455 L545 535" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <path d="M600 455 L655 535" stroke="#f8fafc" stroke-width="10" stroke-linecap="round"/>
  <g opacity="0.25" fill="#94a3b8">
    <circle cx="260" cy="350" r="30"/>
    <rect x="230" y="385" width="60" height="110" rx="20"/>
    <circle cx="930" cy="350" r="30"/>
    <rect x="900" y="385" width="60" height="110" rx="20"/>
    <circle cx="1010" cy="380" r="25"/>
    <rect x="985" y="410" width="50" height="95" rx="18"/>
  </g>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">If one person is always under the spotlight, the system is fragile.</text>
</svg>
