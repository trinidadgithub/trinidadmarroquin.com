<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Transformation theater</title>
  <desc id="desc">A stage presentation labeled DevOps while unchanged silos sit behind the curtain.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="180" y="150" width="840" height="360" rx="18" fill="#1e293b" stroke="#f97316" stroke-width="6"/>
  <rect x="220" y="190" width="760" height="210" rx="14" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <text x="600" y="285" fill="#f8fafc" font-family="Arial, sans-serif" font-size="46" text-anchor="middle" font-weight="700">DevOps Transformation</text>
  <rect x="245" y="430" width="140" height="60" rx="8" fill="#334155"/>
  <rect x="530" y="430" width="140" height="60" rx="8" fill="#334155"/>
  <rect x="815" y="430" width="140" height="60" rx="8" fill="#334155"/>
  <g fill="#94a3b8" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="315" y="467">Dev</text>
    <text x="600" y="467">Ops</text>
    <text x="885" y="467">Sec</text>
  </g>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">Transformation theater is easy to present and hard to operate.</text>
</svg>
