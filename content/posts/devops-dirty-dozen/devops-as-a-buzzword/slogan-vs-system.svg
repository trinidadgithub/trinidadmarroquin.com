<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Slogan vs system</title>
  <desc id="desc">A bright slogan above a complicated system diagram that still needs real work.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <text x="600" y="120" fill="#f97316" font-family="Arial, sans-serif" font-size="48" text-anchor="middle" font-weight="700">Do DevOps!</text>
  <g fill="#1e293b" stroke="#94a3b8" stroke-width="4">
    <rect x="180" y="230" width="150" height="85" rx="10"/>
    <rect x="525" y="210" width="150" height="85" rx="10"/>
    <rect x="870" y="230" width="150" height="85" rx="10"/>
    <rect x="350" y="400" width="150" height="85" rx="10"/>
    <rect x="700" y="400" width="150" height="85" rx="10"/>
  </g>
  <g stroke="#475569" stroke-width="5" fill="none">
    <path d="M330 270 L525 250"/>
    <path d="M675 250 L870 270"/>
    <path d="M600 295 L425 400"/>
    <path d="M600 295 L775 400"/>
    <path d="M500 445 H700"/>
  </g>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">A slogan can point at a problem. It cannot solve the system.</text>
</svg>
