<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Substance over label</title>
  <desc id="desc">A DevOps sign supported by pillars labeled ownership, feedback, automation, safety, and improvement.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <rect x="350" y="100" width="500" height="90" rx="12" fill="#78350f" stroke="#f97316" stroke-width="5"/>
  <text x="600" y="158" fill="#f8fafc" font-family="Arial, sans-serif" font-size="42" text-anchor="middle" font-weight="700">DevOps</text>
  <g fill="#1e293b" stroke="#f97316" stroke-width="4">
    <rect x="210" y="260" width="130" height="230" rx="10"/>
    <rect x="375" y="260" width="130" height="230" rx="10"/>
    <rect x="540" y="260" width="130" height="230" rx="10"/>
    <rect x="705" y="260" width="130" height="230" rx="10"/>
    <rect x="870" y="260" width="130" height="230" rx="10"/>
  </g>
  <g fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">
    <text x="275" y="380">Ownership</text>
    <text x="440" y="380">Feedback</text>
    <text x="605" y="380">Automation</text>
    <text x="770" y="380">Safety</text>
    <text x="935" y="380">Improve</text>
  </g>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">The label only matters if the pillars underneath are real.</text>
</svg>
