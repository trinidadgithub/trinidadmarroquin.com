<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Permanent pilot</title>
  <desc id="desc">A small pilot project circling endlessly beside a blocked main road.</desc>
  <rect width="1200" height="675" fill="#0f172a"/>
  <path d="M120 430 H1060" stroke="#475569" stroke-width="70" stroke-linecap="round"/>
  <rect x="520" y="360" width="160" height="140" rx="14" fill="#78350f" stroke="#f97316" stroke-width="5"/>
  <text x="600" y="436" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="700">Blocked</text>
  <circle cx="360" cy="260" r="95" fill="none" stroke="#f97316" stroke-width="7" stroke-dasharray="18 12"/>
  <circle cx="360" cy="260" r="38" fill="#1e293b" stroke="#f97316" stroke-width="5"/>
  <text x="360" y="268" fill="#f8fafc" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">Pilot</text>
  <text x="600" y="620" fill="#94a3b8" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" font-style="italic">A pilot that never changes the default path is just a sandbox.</text>
</svg>
