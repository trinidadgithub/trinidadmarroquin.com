baseURL = 'https://trinidadmarroquin.com/'
locale = 'en-us'
title = 'Trinidad Marroquin'
theme = "PaperMod"
copyright = "Trinidad Marroquin"

enableRobotsTXT = true
enableEmoji = false

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "github"

[params]
  env = "production"
  description = "Trinidad Marroquin is an SRE and DevOps engineer focused on Kubernetes, Terraform, Rancher, Packer, observability, CI/CD, and reliable infrastructure."
  keywords = ["SRE", "DevOps", "Kubernetes", "Terraform", "Rancher", "Packer", "Observability", "CI/CD", "Infrastructure"]
  author = "Trinidad Marroquin"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  disableSpecial1stPost = true
  disableScrollToTop = false

[params.schema]
  publisherType = "Person"

[params.footer]
  text = "[GitHub](https://github.com/tmarroquin) · [LinkedIn](https://www.linkedin.com/in/trinidadmarroquin/)"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/tmarroquin"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/trinidadmarroquin/"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/posts/"
    weight = 30

  [[menu.main]]
    identifier = "resume"
    name = "Resume"
    url = "/resume/"
    weight = 40
