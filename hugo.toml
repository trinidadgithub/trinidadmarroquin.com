baseURL = 'https://trinidadmarroquin.com/'
locale = 'en-us'
title = 'Trinidad Marroquin'
theme = "PaperMod"
copyright = "Trinidad Marroquin"

enableRobotsTXT = true
enableEmoji = false

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "github"

[params]
  mainSections = ["posts", "field-notes", "projects"]
  env = "production"
  description = "Trinidad Marroquin is an SRE and DevOps engineer focused on Kubernetes, cloud platforms, vCenter, Terraform, Rancher, Packer, Vault, observability, CI/CD, and reliable infrastructure."
  keywords = ["SRE", "DevOps", "Kubernetes", "Cloud Platforms", "AWS", "GCP", "vCenter", "VMware", "Terraform", "Rancher", "Packer", "Vault", "Secrets Management", "Observability", "CI/CD", "Infrastructure"]
  author = "Trinidad Marroquin"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = false
  disableSpecial1stPost = true
  disableScrollToTop = false

[params.fuseOpts]
  isCaseSensitive = false
  includeScore = true
  shouldSort = true
  findAllMatches = true
  ignoreLocation = true
  location = 0
  distance = 100
  threshold = 0.2
  minMatchCharLength = 3
  limit = 10
  keys = ["title", "summary", "content", "tags", "categories", "section"]

[params.schema]
  publisherType = "Person"

[params.footer]
  text = "[GitHub](https://github.com/trinidadgithub) · [LinkedIn](https://www.linkedin.com/in/trinidad-marroquin-9a786311a/)"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/trinidadgithub"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/trinidad-marroquin-9a786311a/"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20

  [[menu.main]]
    identifier = "field-notes"
    name = "Field Notes"
    url = "/field-notes/"
    weight = 30

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/posts/"
    weight = 40

  [[menu.main]]
    identifier = "topics"
    name = "Topics"
    url = "/tags/"
    weight = 50

  [[menu.main]]
    identifier = "articles"
    name = "Articles"
    url = "/archives/"
    weight = 60

  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 70

  [[menu.main]]
    identifier = "resume"
    name = "Resume"
    url = "/resume/"
    weight = 80
